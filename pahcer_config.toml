[general]
version = "0.2.0"

[problem]
problem_name = "awtf2025heuristic"
objective = "Min"
score_regex = '(?m)^\s*Score\s*=\s*(?P<score>\d+)\s*$'

[test]
start_seed = 0
end_seed = 288
threads = 0
out_dir = "./pahcer"

[[test.compile_steps]]
program = "cargo"
args = ["build", "--release"]

[[test.compile_steps]]
program = "rm"
args = ["-f", "./awtf2025heuristic"]

[[test.compile_steps]]
program = "mv"
args = ["../target/release/awtf2025heuristic", "./awtf2025heuristic"]

[[test.test_steps]]
program = "./awtf2025heuristic"
args = []
stdin = "./pahcer/in/{SEED04}.txt"
stdout = "./pahcer/out/{SEED04}.txt"
stderr = "./pahcer/err/{SEED04}.txt"
measure_time = true

[[test.test_steps]]
program = "./vis"
args = ["./pahcer/in/{SEED04}.txt", "./pahcer/out/{SEED04}.txt"]
measure_time = false
